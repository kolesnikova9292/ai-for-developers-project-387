<div class="page-container">
  <h1 class="page-title">
    <mat-icon>event</mat-icon>
    Доступные типы событий
  </h1>

  <div *ngIf="loading" class="spinner-wrapper">
    <mat-spinner></mat-spinner>
  </div>

  <div *ngIf="error" class="error-message">{{ error }}</div>

  <div *ngIf="!loading && !error" class="cards-grid">
    <mat-card *ngFor="let event of eventTypes" class="event-card" appearance="outlined">
      <mat-card-header>
        <mat-icon mat-card-avatar color="primary">calendar_today</mat-icon>
        <mat-card-title>{{ event.title }}</mat-card-title>
        <mat-card-subtitle>
          <mat-chip color="primary" highlighted>{{ event.durationMinutes }} мин</mat-chip>
        </mat-card-subtitle>
      </mat-card-header>
      <mat-card-content>
        <p>{{ event.description }}</p>
      </mat-card-content>
      <mat-card-actions>
        <button mat-flat-button color="primary" (click)="selectEvent(event)">
          <mat-icon>schedule</mat-icon>
          Выбрать слот
        </button>
      </mat-card-actions>
    </mat-card>

    <div *ngIf="eventTypes.length === 0" class="empty-state">
      <mat-icon>inbox</mat-icon>
      <p>Нет доступных типов событий</p>
    </div>
  </div>
</div>
